name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@11.5.2 && npm --version
      - name: Publish the version in package.json if npm does not have it
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@cognicloud/sdk@$version" version >/dev/null 2>&1; then
            echo "@cognicloud/sdk $version is already on npm."
            exit 0
          fi
          npm publish --access public --provenance
          git tag "v$version"
          git push origin "v$version"
